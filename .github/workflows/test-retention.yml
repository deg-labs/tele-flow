name: retention-tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.9'
            os: ubuntu-22.04
          - python: '3.14'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest -r requirements.txt
      - run: python -m pytest -q
